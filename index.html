<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Personal Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Personal Planner">
<meta name="theme-color" content="#f2f1f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f2f1f6;--card:#fcfcfe;--tx:#1b1b21;--mut:#6c6b78;--line:#e7e6ee;--red:#e5443a;--blue:#2f6fed;--sh:0 6px 24px rgba(40,30,90,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#101015;--card:#1b1b23;--tx:#f1f1f6;--mut:#9a99a8;--line:#2b2b36;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme=dark]{--bg:#101015;--card:#1b1b23;--tx:#f1f1f6;--mut:#9a99a8;--line:#2b2b36;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text","SF Pro",Inter,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;min-height:44px;transition:all .15s}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:158px;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:14px 10px;display:flex;flex-direction:column;gap:2px;z-index:20;transition:transform .2s}
.brand{display:flex;gap:8px;align-items:center;padding:4px 6px 12px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f6b24a,#e5443a);display:grid;place-items:center;flex:none;font-size:18px}
.brand input{border:0;background:none;font-weight:700;width:100%;min-height:44px;line-height:1.15;padding:0}
.nv{display:flex;gap:10px;align-items:center;padding:0 12px;border-radius:16px;color:var(--mut);font-size:15px;font-weight:500;width:100%;text-align:left;min-height:44px}
.nv:hover{background:var(--bg)}.nv.on{color:var(--tx);font-weight:600}
.nv.on.home,.nv.on.cal,.nv.on.oth{background:color-mix(in srgb,var(--nav-custom,var(--blue)) 22%,var(--card));color:var(--tx)}
.sp{flex:1}
main{margin-left:188px;padding:20px 20px 40px 6px;max-width:1280px}
.top{display:none}
@media(max-width:820px){main{margin:0;padding:12px}.top{display:flex;align-items:center;gap:8px;padding:4px 0 8px;font-weight:700}.side{transform:translateX(-120%);box-shadow:0 0 0 100vmax rgba(0,0,0,.0),var(--sh)}.side.open{transform:none}}
.card{background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:22px}
.lab{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.lab.red{color:var(--red)}
h1{font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px;font-weight:800}
h2{font-size:22px;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;min-height:44px;border-radius:22px;background:var(--bg);font-weight:600;font-size:15px;border:1px solid var(--line)}
.btn:hover{filter:brightness(.97)}.btn.pri{background:var(--blue);color:#fff;border:0}.btn.red{background:var(--red);color:#fff;border:0}.btn.sq{width:44px;padding:0;border-radius:50%;font-size:22px}
.seg{display:flex;background:var(--bg);border-radius:22px;padding:3px}.seg button{padding:0 14px;border-radius:19px;min-height:38px;font-size:14px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 12px;min-height:44px;border-radius:22px;background:var(--bg);font-size:14px;font-weight:600;border:2px solid transparent}
.chip.off{opacity:.4}.chip.on{border-color:var(--c)}
.pill{display:block;width:100%;text-align:left;font-size:11px;font-weight:600;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--c) 20%,var(--card));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0;margin-top:2px}
.dow,.mg{display:grid;grid-template-columns:repeat(7,1fr)}.dow div{font-size:12px;color:var(--mut);text-align:center;padding:4px}
.mg{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.dc{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;min-width:0;overflow:hidden}
.dc.o{background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--mut)}
.dn{display:block;text-align:right;font-size:13px;font-weight:600;padding:1px 3px}.dn.t{display:inline-grid;place-items:center;float:right;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;padding:0}
.more{font-size:11px;color:var(--mut);font-weight:600;min-height:0;padding:2px 4px}
@media(max-width:600px){.dc{min-height:78px;padding:2px}.pill{font-size:9px;padding:1px 3px}h1{font-size:28px}}
.tl{display:grid;grid-template-columns:44px repeat(var(--n),1fr);font-size:12px;border-top:1px solid var(--line);overflow-x:auto}
.tl .h{padding:6px 2px;text-align:center;border-bottom:1px solid var(--line);font-weight:600}
.tl .hr{height:44px;color:var(--mut);text-align:right;padding-right:6px;font-size:11px}
.col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 44px)}
.col .pill{position:absolute;left:2px;right:2px;width:auto;white-space:normal;padding:3px 5px;font-size:11px}
.yr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mm{text-align:left;padding:10px;border-radius:18px;border:1px solid var(--line);min-height:0}.mm b{display:block;margin-bottom:4px}
.mm .g{display:grid;grid-template-columns:repeat(7,1fr);font-size:10px;text-align:center;gap:1px}.mm .g i{font-style:normal;padding:2px 0;border-radius:50%}.mm .g .e{background:color-mix(in srgb,var(--blue) 25%,transparent)}.mm .g .t{background:var(--red);color:#fff}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
@media(max-width:820px){.home{grid-template-columns:1fr}}
.clk{font-size:64px;font-weight:300;letter-spacing:-.04em;line-height:1}
.grp{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut)}.grp.t{color:var(--red)}
.up{display:flex;gap:10px;padding:6px 0;align-items:stretch;width:100%;text-align:left;min-height:44px}.up i{width:3px;border-radius:2px;background:var(--c);flex:none}.up b{display:block;font-size:15px}.up span{font-size:13px;color:var(--mut)}
.ph{position:relative;border-radius:24px;overflow:hidden;background:var(--bg);min-height:260px;display:grid;place-items:center}.ph img{width:100%;max-height:520px;object-fit:cover;display:block}.ph small{position:absolute;left:14px;bottom:10px;color:#fff;text-shadow:0 1px 4px #000}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row>.g{flex:1}
.st{font-weight:700;color:#c98a00;min-width:44px;text-align:right}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:44px;width:100%}
textarea{padding:10px 12px;min-height:120px;resize:vertical}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ov{position:fixed;inset:0;background:rgba(10,10,20,.45);display:grid;place-items:center;z-index:50;padding:12px}
.sheet{background:var(--card);border-radius:28px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto;display:grid;gap:10px;box-shadow:var(--sh)}
.sheet label{font-size:12px;font-weight:700;color:var(--mut);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ring{display:block;margin:10px auto}
.done{text-decoration:line-through;color:var(--mut)}
#pr{display:none}
@page{size:landscape;margin:10mm}
@media print{body{background:#fff;color:#000}.side,.top,main,.ov{display:none!important}#pr{display:block!important;color:#000;font:11px/1.3 Arial,sans-serif}#pr h1{font-size:22px}#pr table{width:100%;border-collapse:collapse;table-layout:fixed}#pr th,#pr td{border:1px solid #000;vertical-align:top;padding:3px}#pr td{height:84px}#pr td b{display:block;text-align:right}#pr td div{font-size:10px;margin-top:1px}#pr.w td{height:380px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Small refinements only: original two-column design retained */
.catdetail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.catdetail .btn{min-width:0}
.catsetting{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--line);border-radius:16px}
.catsetting input[type=text]{flex:1;min-width:80px}.catsetting input[type=color]{width:48px;height:44px;border:0;padding:0;background:transparent}
@media(max-width:620px){.catdetail{grid-template-columns:1fr}}

.sync-panel{display:grid;gap:9px;border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card)}
.sync-source{display:grid;grid-template-columns:2fr 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sync-check{display:flex;align-items:center;gap:9px}.sync-check input{width:22px;height:22px;flex:none}.sync-check span{font-weight:600;font-size:14px}.sync-check small{display:block;font-weight:400;color:var(--mut);font-size:12px}
@media(max-width:620px){.sync-source{grid-template-columns:1fr}}

/* Personal Planner · Apple-style interface upgrade. Purely visual; calendar-sync.js is unchanged. */
:root { --app-accent:#7855c7; --user-font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif; --user-scale:1; --radius-app:24px; --glass-border:rgba(255,255,255,.79); }
html {scroll-padding-top:0}
body {font-family:var(--user-font)!important;font-size:calc(16px * var(--user-scale)); min-height:100vh; }
body::before {content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 23% 6%,rgba(192,207,235,.52),transparent 48%),radial-gradient(ellipse at 84% 74%,rgba(244,218,225,.6),transparent 45%),linear-gradient(125deg,#f9f9fc,#f1f4f9 60%,#f9f6f7);z-index:-2;pointer-events:none}
:root[data-theme=light]{--bg:#f5f5f9;--card:rgba(255,255,255,.96);--tx:#1c1c1e;--mut:#777781;--line:#e4e4ea;--sh:0 9px 30px rgba(46,44,73,.045)}
:root[data-theme=dark]{--bg:#121217;--card:rgba(32,32,39,.96);--tx:#f7f7fb;--mut:#aaa9b3;--line:#42414a;--sh:0 16px 44px rgba(0,0,0,.24);color-scheme:dark}
:root[data-theme=dark] body::before {background:radial-gradient(ellipse at 15% 4%,#202334 0%,transparent 52%),linear-gradient(135deg,#101116,#232129 70%,#171923)}
:root[data-theme=glass]{--bg:#bfc8dc;--card:rgba(229,233,244,.43);--glass-border:rgba(242,245,255,.48);--tx:#191b25;--mut:#4f566a;--line:rgba(96,107,146,.23);--sh:0 13px 35px rgba(48,54,92,.15), inset 0 1px 0 rgba(255,255,255,.42);color-scheme:light}
:root[data-theme=glass] body::before{background:radial-gradient(ellipse at 2% 8%,rgba(115,137,183,.53),transparent 51%),radial-gradient(ellipse at 85% 20%,rgba(164,149,198,.42),transparent 51%),radial-gradient(ellipse at 45% 108%,rgba(191,149,156,.38),transparent 49%),linear-gradient(125deg,#b6c3d9 0%,#cbd0df 54%,#d9c9d6 100%)}
body.ui-has-wallpaper::before{background-image:linear-gradient(rgba(236,237,246,.18),rgba(233,233,247,.26)),var(--user-wallpaper);background-size:cover;background-position:center}
:root[data-theme=dark] body.ui-has-wallpaper::before{background-image:linear-gradient(rgba(8,8,15,.55),rgba(8,8,15,.65)),var(--user-wallpaper)}
.side{width:180px;left:16px;top:16px;bottom:16px;border-radius:27px;padding:18px 10px;background:var(--card);border:1px solid var(--glass-border);box-shadow:var(--sh);gap:3px;}
:root[data-theme=glass] .side,:root[data-theme=glass] .card,:root[data-theme=glass] .ui-panel,:root[data-theme=glass] .ui-glass-panel,:root[data-theme=glass] .sheet{backdrop-filter:blur(25px) saturate(135%);-webkit-backdrop-filter:blur(25px) saturate(135%);border:1px solid rgba(247,248,255,.52);box-shadow:0 12px 35px rgba(55,61,100,.14),inset 0 1.2px 1px rgba(255,255,255,.49),inset 0 -1px rgba(255,255,255,.12)}
:root[data-theme=dark] .side,:root[data-theme=dark] .card,:root[data-theme=dark] .ui-panel{border-color:rgba(255,255,255,.1)}
.brand{padding:6px 9px 19px;gap:9px}.brand .av{width:40px;height:40px;border-radius:12px;overflow:hidden;font-size:24px;background:linear-gradient(130deg,#fce8ef,#e3dbfc)}.brand .av img{width:100%;height:100%;object-fit:cover;display:block}.brand input{font-size:17px;font-weight:700;letter-spacing:-.03em}
.nv{min-height:44px;border-radius:14px;padding:0 12px;font-size:14px;color:var(--mut)}.nv svg{width:18px;height:18px;flex:none}.nv.on{color:var(--app-accent)!important;background:color-mix(in srgb,var(--app-accent) 13%,var(--card))!important;font-weight:650}.nv:active,.btn:active{transform:scale(.985)}
main{margin-left:208px;padding:18px 22px 48px 5px;max-width:none;width:calc(100% - 208px)}
.card,.ui-panel{border-radius:var(--radius-app);background:var(--card);border:1px solid var(--glass-border);box-shadow:var(--sh);padding:20px}.card h1,.ui-panel h1{font-size:32px;letter-spacing:-.035em;font-weight:720}.card h2,.ui-panel h2{font-size:21px;font-weight:700;letter-spacing:-.025em}
.btn,.chip,.seg{border-radius:999px}.btn{font-weight:560;border-color:var(--line);background:color-mix(in srgb,var(--card) 86%,var(--bg));box-shadow:0 1px 3px rgba(0,0,0,.025)}.btn.pri{background:var(--app-accent)!important;color:#fff}.btn.red{background:#f24b45}.btn.sq{font-weight:480}
:root[data-theme=glass] .btn,:root[data-theme=glass] .chip,:root[data-theme=glass] .seg,:root[data-theme=glass] .ui-float{background:rgba(232,236,247,.32);border:1px solid rgba(247,248,255,.56);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 3px 9px rgba(57,70,91,.1),inset 0 1px rgba(255,255,255,.55)}
:root[data-theme=glass] .seg button.on{background:rgba(239,241,249,.66)}
:root[data-theme=dark] .btn{background:#35353f;border-color:#454550}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:color-mix(in srgb,var(--card) 75%,var(--bg));border:1px solid var(--line);border-radius:12px}
input[type=checkbox]{accent-color:var(--app-accent)}
input[type=color]{cursor:pointer}
/* Home - precisely two balanced columns; widgets may reorder inside each column */
.ui-home-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}.ui-home-head h1{margin:0;font-size:26px;font-weight:720}.ui-home-head .sub{font-size:12px}
.ui-home-grid{display:grid;grid-template-columns:minmax(0,.87fr) minmax(0,1.13fr);gap:16px;align-items:start}
.ui-home-column{display:flex;flex-direction:column;gap:16px;min-width:0}.ui-home-column>.ui-panel{min-width:0}
.ui-clock{min-height:166px;display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:22px 24px}
.ui-clock .ui-day{font-size:12px;color:#ee4c46;font-weight:750;text-transform:uppercase;letter-spacing:.04em}.ui-clock .ui-date{font-size:19px;font-weight:610;letter-spacing:-.02em}.ui-clock .clk{font-size:64px;line-height:1.05;font-weight:300;letter-spacing:-.055em;padding-top:6px;white-space:nowrap;background:none!important;text-shadow:none!important;box-shadow:none!important}
.ui-clock .clk span{background:none!important;box-shadow:none!important;text-shadow:none!important;color:var(--mut)!important}
.ui-weather{text-align:right;min-width:125px}.ui-weather .ui-wtemp{display:flex;justify-content:flex-end;gap:4px;align-items:center}.ui-weather .ui-wtemp input{font-weight:330;font-size:36px!important;text-align:right;width:105px!important;min-height:41px;border:0;background:transparent;padding:0}.ui-weather #wc{font-size:13px;text-align:right;border:0;background:transparent;padding:0;max-width:140px}
.ui-panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.ui-panel-head h2{margin:0}.ui-home-upcoming .up{padding:9px 0}.ui-home-upcoming .up i{width:4px}.ui-home-upcoming .grp{margin-top:12px}.ui-home-upcoming{min-height:350px}
.ui-photo{padding:8px!important}.ui-photo .ph{min-height:285px;height:355px;border-radius:19px}.ui-photo .ph img{height:100%;max-height:none;object-fit:cover}.ui-photo-tools{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:10px 7px 3px}.ui-photo .ui-photo-tools .btn{min-height:36px;font-size:13px}
.ui-home-tasks{min-height:260px}.ui-home-task-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.ui-home-task-row input{width:22px;height:22px;flex:none}.ui-home-task-row .ui-task-title{flex:1;min-width:0}.ui-category-tag{display:inline-flex;font-size:11px;line-height:1.2;align-items:center;border-radius:99px;padding:5px 10px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--tx)}
.ui-widget-handle{display:none;align-items:center;gap:4px;padding:6px;background:var(--bg);border-radius:13px;margin-top:12px;flex-wrap:wrap}.ui-home-editing .ui-widget-handle{display:flex}.ui-widget-handle button{padding:4px 8px;font-size:12px;min-height:34px;border-radius:10px;border:1px solid var(--line)}
[data-ui-label]{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:context-menu}
.ui-home-mini .dow{margin-top:12px}.ui-home-mini .mg .dc{min-height:45px}.ui-home-mini .mg .pill{display:none}
.ui-empty{font-size:14px;color:var(--mut);padding:12px 0}
/* iCloud Calendar-inspired grid */
.ui-cal-header .lab{color:#fc4c42}.ui-cal-header .hd{align-items:center}.ui-cal-header h1{font-size:36px}.ui-cal-header .chips{margin:12px 0 16px}.ui-cal-header .chip{font-weight:570}.ui-cal-header .pill{font-size:11px;background:color-mix(in srgb,var(--c) 18%,transparent);border-left:3px solid var(--c);color:var(--tx);padding:3px 5px}.ui-cal-header .mg{background:color-mix(in srgb,var(--card) 85%,transparent);border-top:1px solid var(--line);border-left:1px solid var(--line)}.ui-cal-header .dc{min-height:clamp(90px,calc((100vh - 265px)/5),155px);padding:5px}.ui-cal-header .dn{font-weight:520;font-size:14px}.ui-cal-header .dn.t{background:#ff3b30}.ui-cal-header .dc.o{opacity:.45}
/* Task and category pages: Apple Reminders density */
.ui-page-head{margin-bottom:15px}.ui-page-head .lab{color:var(--app-accent)}.ui-page-head h1{font-size:36px;margin:4px 0 6px}.ui-page-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:16px;align-items:start}
.ui-task-page .ui-task-filter{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.ui-task-page .ui-task-filter button{border-radius:999px;min-height:36px;padding:0 13px;border:1px solid var(--line);background:var(--card)}.ui-task-page .ui-task-filter button.active{background:color-mix(in srgb,var(--app-accent) 15%,var(--card));border-color:color-mix(in srgb,var(--app-accent) 35%,transparent);color:var(--app-accent)}

if(!S||!Array.isArray(S.ev)) S=seed();
S.navLabels=S.navLabels||{};S.navColors=S.navColors||{};S.photos=S.photos||[];S.theme=S.theme||'light';
if(!S.personalV3){
 if(S.sample){S.ev=(S.ev||[]).filter(e=>!(Number.isInteger(e.id)&&e.id>=1&&e.id<=9)); S.tk=(S.tk||[]).filter(e=>!(Number.isInteger(e.id)&&e.id>=1&&e.id<=3))}
 const old={emma:'school',leo:'school',mom:'personal',dad:'professional'};
 S.ev.forEach(e=>{e.p=old[e.p]||((['school','professional','personal'].includes(e.p))?e.p:'personal')});
 S.tk.forEach(e=>{e.p=old[e.p]||((['school','professional','personal'].includes(e.p))?e.p:'personal')});
 S.name=(!S.name||S.name==='Parker Family')?'My Planner':S.name;
 S.sample=0;S.personalV3=true;
 if(S.photo)S.photos.push({id:'legacy',src:S.photo,caption:'My photo'});
}
S.categories=S.categories&&S.categories.length?S.categories:P;
P=S.categories;
S.people=undefined;S.stars=undefined;S.meals=undefined;
function theme(){if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme)}
theme();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...S,categories:P}))}catch(e){toast('Storage is full or blocked; changes won’t persist.')}};
let V='home',M='month',C=new Date(),TT={total:300,left:300,run:0,iv:0},MW=new Date();
const uid=()=>Date.now()+Math.floor(Math.random()*1e3);
function occ(d){const s=ymd(d);return S.ev.filter(e=>!S.hidden.includes(e.p)&&(e.date===s||(e.rep&&e.rep!=='none'&&s>e.date&&(e.rep==='daily'||(e.rep==='weekly'&&pd(e.date).getDay()===d.getDay())||(e.rep==='monthly'&&+e.date.slice(8)===d.getDate()))))).sort((a,b)=>((a.ad?'':a.st||'')).localeCompare(b.ad?'':b.st||''))}
const pill=(e,x='')=>`<button class="pill" data-a="edit" data-id="${e.id}" style="--c:${pp(e.p).c};${x}" title="${esc(e.t)}">${e.ad||!e.st?'':f12(e.st).replace(':00','').replace(' ','').toLowerCase()+' '}${esc(e.t)}</button>`;
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:99';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function nav(){const it=(k,l,i,c)=>{const label=S.navLabels[k]||l,col=S.navColors[k]||'#d9d9e5';return `<button class="nv ${V===k?'on '+c:''}" style="--nav-custom:${col}" data-a="go" data-v="${k}">${ic(i)}<span>${esc(label)}</span></button>`};
$('#side').innerHTML=`<div class="brand"><div class="av">🌷</div><input id="nm" value="${esc(S.name)}" aria-label="Planner name"></div>${it('home','Home','home','home')}${it('cal','Calendar','cal','cal')}${it('tasks','Tasks','tasks','oth')}${it('school','School','tasks','oth')}${it('professional','Professional','tasks','oth')}${it('personal','Personal','home','oth')}${it('notes','Notes','notes','oth')}${it('photos','Photos','photos','oth')}<div class="sp"></div>${it('timer','Focus Timer','timer','oth')}${it('set','Settings','set','oth')}`}

function render(){nav();const m=$('#m');const top=`<div class="top"><button class="btn sq" data-a="menu" aria-label="Menu">☰</button>${esc(S.name)}</div>`;
m.innerHTML=top+({home:home,cal:cal,tasks:tasks,school:()=>section('school'),professional:()=>section('professional'),personal:()=>section('personal'),notes:notes,photos:photos,timer:timer,set:sets}[V]||home)();if(V==='timer')ring()}
function home(){const t=new Date(),days=[];for(let i=0;i<14;i++){const d=ad(t,i),o=occ(d);if(o.length)days.push([d,i,o])}
const lab=(d,i)=>i===0?'TODAY':i===1?'TOMORROW':DN[d.getDay()].toUpperCase()+'DAY'.replace('DAY','')+' '+MN[d.getMonth()].slice(0,3)+' '+d.getDate();
const full=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
return`<div class="home"><div style="display:grid;gap:16px;align-content:start"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="lab red">${full[t.getDay()]}</div><div style="font-weight:700;font-size:18px">${MN[t.getMonth()]} ${t.getDate()}</div><div class="clk" id="clk"></div></div>
<div style="text-align:right;min-width:130px"><div style="font-size:40px;font-weight:300"><input type="text" id="wt" value="${esc(S.wx.t)}" aria-label="Temperature" style="width:90px;text-align:right;font-size:28px;border:0;background:none"></div><input type="text" id="wc" value="${esc(S.wx.city)}" aria-label="City" style="width:130px;text-align:right;border:0;background:none;color:var(--mut)"></div></div></div>
<div class="card"><h2>Up next</h2>${days.length?days.map(([d,i,o])=>`<div class="grp ${i?'':'t'}">${i<2?lab(d,i):full[d.getDay()]} <span style="font-weight:500">${MN[d.getMonth()].slice(0,3)} ${d.getDate()}</span></div>`+o.map(e=>`<button class="up" data-a="edit" data-id="${e.id}" style="--c:${pp(e.p).c}"><i></i><div><b>${esc(e.t)}</b><span>${e.ad?'All-day':f12(e.st)+(e.en?' – '+f12(e.en):'')}${e.n?' · '+esc(e.n):''}</span></div></button>`).join('')).join(''):'<p class="sub">Nothing in the next two weeks. Tap + in Calendar to add an event.</p>'}</div></div>
<div style="display:grid;gap:16px;align-content:start"><div class="card" style="padding:12px">${phbox()}</div><div class="card"><div class="lab">✓ My priorities</div><h2 style="margin-top:8px">Tasks to focus on</h2>${S.tk.filter(x=>!x.x).sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999')).slice(0,7).map(x=>`<div class="row"><input type="checkbox" data-a="tick" data-id="${x.id}" style="width:24px;height:24px"><div class="g"><b>${esc(x.t)}</b><div class="sub">${esc(pp(x.p).n)}${x.d?' · '+esc(x.d):''}</div></div><button class="btn sq" data-a="edittk" data-id="${x.id}" aria-label="Edit task">✎</button></div>`).join('')||'<p class="sub">No tasks yet. Add something from the Tasks tab.</p>'}<div class="ctl" style="margin-top:8px"><button class="btn" data-a="go" data-v="tasks">All tasks</button></div></div></div></div>`}
function phbox(){return`<div class="ph">${S.photo?`<img src="${S.photo}" alt="Your photo"><small>${esc(S.photoDate)}</small>`:'<span class="sub">No photo selected — upload your own</span>'}</div><div style="padding:10px 6px 2px"><label class="btn">📷 ${S.photo?'Change':'Choose'} photo<input type="file" id="pf" accept="image/*" hidden></label></div>`}
function ttl(){if(M==='month')return MN[C.getMonth()]+' '+C.getFullYear();if(M==='year')return''+C.getFullYear();if(M==='day')return DN[C.getDay()]+', '+MN[C.getMonth()].slice(0,3)+' '+C.getDate();const s=ad(C,-C.getDay()),e=ad(s,6);return MN[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+(e.getMonth()!==s.getMonth()?MN[e.getMonth()].slice(0,3)+' ':'')+e.getDate()+', '+e.getFullYear()}
function mcount(){let n=0;const y=C.getFullYear(),m=C.getMonth();for(let d=1;d<=new Date(y,m+1,0).getDate();d++)n+=occ(new Date(y,m,d)).length;return n}
function cal(){const body={month:mgrid,week:()=>tl(7),day:()=>tl(1),year:yr}[M]();const cnt=M==='month'?mcount()+' events this month':'';
return`<div class="card"><div class="hd"><div><div class="lab red">${ic('cal')} Calendar</div><h1>${ttl()}</h1><div class="sub">${cnt}</div></div><div class="ctl"><button class="btn" data-a="today">Today</button><button class="btn sq" data-a="step" data-v="-1" aria-label="Previous">‹</button><button class="btn sq" data-a="step" data-v="1" aria-label="Next">›</button><div class="seg" role="group">${['day','week','month','year'].map(k=>`<button class="${M===k?'on':''}" data-a="mode" data-v="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div><button class="btn sq red" data-a="new" data-d="${ymd(C)}" aria-label="Add event">+</button></div></div>
<div class="chips">${P.map(p=>`<button class="chip ${S.hidden.includes(p.id)?'off':'on'}" style="--c:${p.c}" data-a="flt" data-id="${p.id}" aria-pressed="${!S.hidden.includes(p.id)}">${p.e} ${p.n}</button>`).join('')}</div>${body}</div>`}
function mgrid(){const f=new Date(C.getFullYear(),C.getMonth(),1),s=ad(f,-f.getDay()),td=ymd(new Date());let h='<div class="dow">'+DN.map(d=>`<div>${d}</div>`).join('')+'</div><div class="mg">';
for(let i=0;i<42;i++){const d=ad(s,i);if(i>=35&&d.getMonth()!==C.getMonth())break;const o=occ(d),x=ymd(d)===td;h+=`<div class="dc ${d.getMonth()!==C.getMonth()?'o':''}" data-a="new" data-d="${ymd(d)}"><span class="dn ${x?'t':''}">${d.getDate()}</span><div style="clear:both"></div>${o.slice(0,3).map(e=>pill(e)).join('')}${o.length>3?`<button class="more" data-a="goday" data-d="${ymd(d)}">+${o.length-3} more</button>`:''}</div>`}return h+'</div>'}
function tl(n){const s=n===1?C:ad(C,-C.getDay()),days=[...Array(n)].map((_,i)=>ad(s,i)),td=ymd(new Date());let h=`<div class="tl" style="--n:${n}"><div class="h"></div>`+days.map(d=>`<div class="h" style="${ymd(d)===td?'color:var(--red)':''}">${DN[d.getDay()]} ${d.getDate()}</div>`).join('')+'<div class="h sub" style="font-size:10px">all-day</div>'+days.map(d=>`<div class="h" style="text-align:left">${occ(d).filter(e=>e.ad).map(e=>pill(e)).join('')}</div>`).join('');
h+='<div>'+[...Array(16)].map((_,i)=>`<div class="hr">${f12(pad(i+7)+':00').replace(':00','')}</div>`).join('')+'</div>';
days.forEach(d=>{h+=`<div class="col" style="height:704px" data-a="new" data-d="${ymd(d)}">`+occ(d).filter(e=>!e.ad&&e.st).map(e=>{const a=e.st.split(':'),b=(e.en||e.st).split(':'),s1=+a[0]*60+ +a[1],e1=Math.max(+b[0]*60+ +b[1],s1+30);return pill(e,`top:${Math.max(0,(s1-420)/60*44)}px;height:${(e1-s1)/60*44-2}px`)}).join('')+'</div>'});return h+'</div>'}
function yr(){return'<div class="yr">'+[...Array(12)].map((_,m)=>{const f=new Date(C.getFullYear(),m,1),nd=new Date(C.getFullYear(),m+1,0).getDate(),td=ymd(new Date());let g=DN.map(d=>`<i>${d[0]}</i>`).join('')+'<i></i>'.repeat(f.getDay());for(let d=1;d<=nd;d++){const x=new Date(C.getFullYear(),m,d);g+=`<i class="${ymd(x)===td?'t':occ(x).length?'e':''}">${d}</i>`}return`<button class="mm" data-a="ym" data-v="${m}"><b>${MN[m]}</b><div class="g">${g}</div></button>`}).join('')+'</div>'}
function sheet(e,d){const x=e||{t:'',p:'personal',date:d,st:'09:00',en:'10:00',ad:0,rep:'none',n:''};
$('#ov').innerHTML=`<div class="ov" data-a="close"><div class="sheet" role="dialog" aria-label="Event"><h2>${e?'Edit event':'New event'}</h2><label>Title<input type="text" id="f-t" value="${esc(x.t)}" autofocus></label><div class="two"><label>Category<select id="f-p">${P.map(p=>`<option value="${p.id}" ${p.id===x.p?'selected':''}>${p.e} ${p.n}</option>`).join('')}</select></label><label>Date<input type="date" id="f-d" value="${x.date}"></label></div><label style="display:flex;grid-auto-flow:column;align-items:center;gap:8px;justify-content:start"><input type="checkbox" id="f-ad" ${x.ad?'checked':''} style="width:22px;height:22px">All-day</label><div class="two"><label>Start<input type="time" id="f-st" value="${x.st}"></label><label>End<input type="time" id="f-en" value="${x.en}"></label></div><label>Repeat<select id="f-r">${['none','daily','weekly','monthly'].map(r=>`<option ${r===x.rep?'selected':''}>${r}</option>`).join('')}</select></label><label>Notes<textarea id="f-n" style="min-height:70px">${esc(x.n)}</textarea></label><div class="ctl" style="justify-content:flex-end"><button class="btn" data-a="close">Cancel</button>${e?`<button class="btn" style="color:var(--red)" data-a="del" data-id="${e.id}">Delete</button>`:''}<button class="btn pri" data-a="saveev" data-id="${e?e.id:''}">Save event</button></div></div></div>`;setTimeout(()=>$('#f-t')&&$('#f-t').focus(),30)}
function tasks(){const o=S.tk.slice().sort((a,b)=>a.x-b.x||(a.d||'9').localeCompare(b.d||'9'));return`<div class="card"><div class="lab">${ic('tasks')} Tasks</div><h1>To do</h1><div class="two" style="grid-template-columns:2fr 1fr 1fr auto;margin:12px 0"><input type="text" id="tt" placeholder="Add a task" aria-label="Task"><select id="tp" aria-label="Category">${P.map(p=>`<option value="${p.id}">${p.e} ${p.n}</option>`).join('')}</select><input type="date" id="td" aria-label="Due date"><button class="btn pri" data-a="addtk">Add</button></div>${o.length?o.map(t=>`<div class="row"><input type="checkbox" ${t.x?'checked':''} data-a="tick" data-id="${t.id}" style="width:24px;height:24px" aria-label="Done"><span class="dot" style="--c:${pp(t.p).c}"></span><div class="g ${t.x?'done':''}">${esc(t.t)}</div><span class="sub">${t.d?MN[pd(t.d).getMonth()].slice(0,3)+' '+pd(t.d).getDate():''}</span><button class="btn sq" data-a="deltk" data-id="${t.id}" aria-label="Delete">×</button></div>`).join(''):'<p class="sub">No tasks yet. Add the first one above.</p>'}</div>`}
function meals(){const s=ad(MW,-MW.getDay());return`<div class="card"><div class="hd"><div><div class="lab">${ic('meals')} Meals</div><h1>This week’s dinners</h1></div><div class="ctl"><button class="btn sq" data-a="mw" data-v="-7" aria-label="Previous week">‹</button><button class="btn sq" data-a="mw" data-v="7" aria-label="Next week">›</button></div></div>${[...Array(7)].map((_,i)=>{const d=ad(s,i);return`<div class="row"><b style="width:70px">${DN[d.getDay()]} ${d.getDate()}</b><input type="text" data-meal="${ymd(d)}" value="${esc(S.meals[ymd(d)]||'')}" placeholder="What’s for dinner?" aria-label="Meal ${ymd(d)}"></div>`}).join('')}</div>`}
const notes=()=>`<div class="card"><div class="lab">${ic('notes')} Notes</div><h1>Personal notes</h1><textarea id="nt" style="min-height:360px;margin-top:10px" placeholder="Wi-Fi password, gift ideas, anything worth keeping…">${esc(S.notes)}</textarea></div>`;
function section(k){const p=pp(k),events=S.ev.filter(x=>x.p===k).sort((a,b)=>a.date.localeCompare(b.date)),tasks_=S.tk.filter(x=>x.p===k).sort((a,b)=>a.x-b.x);return`<div class="card"><div class="lab" style="color:${p.c}">${p.e} ${esc(p.n)}</div><h1>${esc(p.n)}</h1><div class="hd" style="margin-top:20px"><h2>Calendar</h2><button class="btn pri" data-a="newcat" data-k="${k}">+ Add event</button></div>${events.map(x=>`<button class="up" data-a="edit" data-id="${x.id}" style="--c:${p.c}"><i></i><div><b>${esc(x.t)}</b><span>${esc(x.date)}${x.ad?' · All-day':' · '+f12(x.st)}</span></div></button>`).join('')||'<p class="sub">No events in this category yet.</p>'}<div class="hd" style="margin-top:25px"><h2>Tasks</h2><button class="btn" data-a="go" data-v="tasks">Add tasks</button></div>${tasks_.map(x=>`<div class="row"><input type="checkbox" data-a="tick" data-id="${x.id}" ${x.x?'checked':''} style="width:24px;height:24px"><div class="g"><b class="${x.x?'done':''}">${esc(x.t)}</b><div class="sub">${esc(x.d||'No deadline')}</div></div><button class="btn sq" data-a="edittk" data-id="${x.id}">✎</button></div>`).join('')||'<p class="sub">No tasks here yet.</p>'}</div>`}
function taskEditor(x){$('#ov').innerHTML=`<div class="ov" data-a="close"><div class="sheet"><h2>Edit task</h2><label class="sub">Task<input id="et-title" value="${esc(x.t)}"></label><label class="sub">Category<select id="et-cat">${P.map(p=>`<option value="${p.id}" ${x.p===p.id?'selected':''}>${p.e} ${esc(p.n)}</option>`).join('')}</select></label><label class="sub">Due date<input type="date" id="et-date" value="${esc(x.d||'')}"></label><div class="ctl"><button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="savetk" data-id="${x.id}">Save</button></div></div></div>`}
const photos=()=>`<div class="card"><div class="lab">${ic('photos')} Photos</div><h1>My photos</h1><p class="sub">Only photos you choose will appear here. Photos stay in this iPad's app storage; use backups to keep copies.</p><label class="btn pri">＋ Add photos<input type="file" id="gallery-file" accept="image/*" multiple hidden></label><div class="catdetail" style="margin-top:16px">${S.photos.map(p=>`<div class="card" style="padding:8px"><img src="${p.src}" style="width:100%;height:170px;object-fit:cover;border-radius:14px" alt="Uploaded photo"><input data-phcaption="${p.id}" type="text" aria-label="Photo caption" value="${esc(p.caption||'')}" placeholder="Caption"><button class="btn" data-a="delphoto" data-id="${p.id}">Remove</button></div>`).join('')||'<p class="sub">Your gallery is empty.</p>'}</div></div>`;
function timer(){const pre=[1,5,10,15,30];return`<div class="card" style="text-align:center"><div class="lab" style="justify-content:center">${ic('timer')} Timer</div><svg class="ring" id="rg" width="240" height="240" viewBox="0 0 220 220"><circle cx="110" cy="110" r="95" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rc" cx="110" cy="110" r="95" fill="none" stroke="var(--blue)" stroke-width="12" stroke-linecap="round" stroke-dasharray="597" transform="rotate(-90 110 110)"/><text id="rt" x="110" y="124" text-anchor="middle" font-size="44" font-weight="300" fill="currentColor"></text></svg><div class="ctl" style="justify-content:center"><button class="btn pri" data-a="tgo" style="min-width:100px" id="tgo">${TT.run?'Pause':'Start'}</button><button class="btn" data-a="trs">Reset</button></div><div class="ctl" style="justify-content:center;margin-top:12px">${pre.map(m=>`<button class="btn" data-a="tset" data-v="${m}">${m} min</button>`).join('')}<input type="number" id="tc" min="1" max="600" placeholder="Custom min" style="width:130px" aria-label="Custom minutes"><button class="btn" data-a="tset" data-v="c">Set</button></div></div>`}
function ring(){const r=$('#rc');if(!r)return;r.style.strokeDashoffset=597*(1-TT.left/TT.total);$('#rt').textContent=pad(Math.floor(TT.left/60))+':'+pad(TT.left%60);const b=$('#tgo');if(b)b.textContent=TT.run?'Pause':'Start'}
function tick(){if(!TT.run)return;TT.left--;if(TT.left<=0){TT.left=0;TT.run=0;clearInterval(TT.iv);try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();setTimeout(()=>o.stop(),700);navigator.vibrate&&navigator.vibrate(400)}catch(e){}toast('Timer done')}ring()}
function sets(){return`<div class="card" style="display:grid;gap:14px"><div><div class="lab">${ic('set')} Settings</div><h1>Settings</h1></div>
<label class="sub">Planner name<input type="text" id="sn" value="${esc(S.name)}"></label>
<label class="sub">Planner appearance<select id="theme"><option value="light" ${S.theme==='light'?'selected':''}>Light</option><option value="dark" ${S.theme==='dark'?'selected':''}>Dark</option><option value="system" ${S.theme==='system'?'selected':''}>Follow iPad setting</option></select></label>
<h2>Customize sections</h2><p class="sub">You can edit each sidebar title, highlight color, category name, icon and color.</p>
<div style="display:grid;gap:9px">${[['home','Home'],['cal','Calendar'],['tasks','Tasks'],['school','School'],['professional','Professional'],['personal','Personal'],['notes','Notes'],['photos','Photos'],['timer','Focus Timer'],['set','Settings']].map(([k,l])=>`<div class="row"><label class="sub" style="flex:1">${l}<input type="text" maxlength="24" value="${esc(S.navLabels[k]||l)}" data-navlabel="${k}" aria-label="${l} tab label"></label><label class="sub" style="width:86px">Color<input type="color" value="${S.navColors[k]||'#d9d9e5'}" data-navcolor="${k}" aria-label="${l} tab color" style="width:100%;height:44px;padding:2px;border:1px solid var(--line);border-radius:12px;background:var(--card)"></label></div>`).join('')}</div>
<h2>Calendar categories</h2>${P.map((p,i)=>`<div class="catsetting"><input type="text" value="${esc(p.e)}" data-catfield="e" data-catindex="${i}" aria-label="Category emoji" style="width:52px;flex:none"><input type="text" value="${esc(p.n)}" data-catfield="n" data-catindex="${i}" aria-label="Category name"><input type="color" value="${p.c}" data-catfield="c" data-catindex="${i}" aria-label="Category color"></div>`).join('')}

    const box=document.createElement('div');box.className='ov';box.id='ui-label-sheet';box.innerHTML=`<div class="sheet" role="dialog" aria-label="Edit widget text"><h2>Edit Home title</h2><p class="sub">Rename this heading or hide just its title. The widget itself stays on your Home screen.</p><label>Text<input id="ui-label-edit" type="text" maxlength="50" value="${safe(wlabel(key))}"></label><label>Title color<input id="ui-label-color" type="color" value="${ui.labelColors[key]||ui.accent}" style="width:90px;height:43px;border:0;background:none"></label><div class="ctl" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn" data-ui-action="close-label">Cancel</button><button class="btn" data-ui-action="hide-label" data-key="${key}">Hide title</button><button class="btn pri" data-ui-action="save-label" data-key="${key}">Save wording</button></div></div>`;document.body.appendChild(box);

  function widgetMove(key,dir){const oldSide=ui.widgetColumns.left.includes(key)?'left':'right',other=oldSide==='left'?'right':'left',arr=ui.widgetColumns[oldSide],idx=arr.indexOf(key);if(idx<0)return;
    if(dir==='side'){arr.splice(idx,1);ui.widgetColumns[other].push(key)}else{const next=dir==='up'?idx-1:idx+1;if(next>=0&&next<arr.length){[arr[idx],arr[next]]=[arr[next],arr[idx]];}}
    save();render();
  }
  // Live weather: free non-commercial Open-Meteo API, no key and no worker changes.
  // Only coordinates and the latest reading are kept in this device's planner storage.
  const weatherCode=(code,isDay)=>{
    const c=Number(code);
    if(c===0)return {text:'Clear',icon:isDay?'☀️':'🌙'};
    if(c<=3)return {text:c===1?'Mostly clear':c===2?'Partly cloudy':'Cloudy',icon:isDay?'⛅':'☁️'};
    if(c===45||c===48)return {text:'Fog',icon:'🌫️'};
    if(c>=51&&c<=57)return {text:'Drizzle',icon:'🌦️'};
    if(c>=61&&c<=67)return {text:'Rain',icon:'🌧️'};
    if(c>=71&&c<=77)return {text:'Snow',icon:'❄️'};
    if(c>=80&&c<=82)return {text:'Rain showers',icon:'🌦️'};
    if(c>=85&&c<=86)return {text:'Snow showers',icon:'🌨️'};
    if(c>=95)return {text:'Thunderstorms',icon:'⛈️'};
    return {text:'Current weather',icon:'☁️'};
  };
  let weatherBusy=false,weatherGeoBusy=false;
  const weatherStatus=msg=>{ui.weather.status=String(msg);const el=document.getElementById('ui-weather-status');if(el)el.textContent=msg;};
  function updateWeatherDOM(){const w=ui.weather;
    const bind=[['ui-weather-icon',w.icon||'☀️'],['ui-weather-temp',w.temperature||'--°'],['ui-weather-condition',w.condition||'Weather unavailable'],['ui-weather-location',w.city||'']];
    for(const [id,v] of bind){const node=document.getElementById(id);if(node)node.textContent=v;}
  }
  async function weatherFetch(force=false){const w=ui.weather;
    if(weatherBusy||!Number.isFinite(Number(w.lat))||!Number.isFinite(Number(w.lon))||w.lat===null||w.lon===null)return;
    if(!force&&Date.now()-(w.lastSync||0)<25*60*1000){updateWeatherDOM();return;}
    weatherBusy=true;
    try{
      const params=new URLSearchParams({latitude:String(w.lat),longitude:String(w.lon),current:'temperature_2m,weather_code,is_day',temperature_unit:w.unit||'fahrenheit',timezone:'auto'});
      const response=await fetch('https://api.open-meteo.com/v1/forecast?'+params.toString(),{cache:'no-store'});
      if(!response.ok)throw new Error('Weather service returned '+response.status);
      const obj=await response.json();const cur=obj.current;
      if(!cur||!Number.isFinite(Number(cur.temperature_2m)))throw new Error('No current conditions returned');
      const label=weatherCode(cur.weather_code,cur.is_day);
      w.temperature=Math.round(Number(cur.temperature_2m))+'°';w.condition=label.text;w.icon=label.icon;w.lastSync=Date.now();w.status='Updated '+new Date(w.lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
      // Keep exports and legacy clock working with the live reading.
      S.wx.t=w.temperature;S.wx.city=w.condition;
      save();updateWeatherDOM();weatherStatus(w.status);
    }catch(err){weatherStatus('Weather unavailable: check your internet connection.');updateWeatherDOM();}
    finally{weatherBusy=false;}
  }
  async function weatherCity(city){const val=String(city||'').trim();if(!val){weatherStatus('Enter a city first.');return;}
    weatherStatus('Finding '+val+'…');
    try{
      const response=await fetch('https://geocoding-api.open-meteo.com/v1/search?'+new URLSearchParams({name:val,count:'1',language:'en',format:'json'}));
      if(!response.ok)throw new Error('Geocoding unavailable');
      const json=await response.json(),place=json.results?.[0];if(!place)throw new Error('City not found');
      Object.assign(ui.weather,{mode:'city',city:[place.name,place.admin1].filter(Boolean).join(', '),lat:place.latitude,lon:place.longitude,lastSync:0});save();await weatherFetch(true);
    }catch(err){weatherStatus('Could not find that city. Try another city name.');}
  }
  function weatherLocation(showAlert=false){const w=ui.weather;
    if(weatherGeoBusy)return;
    if(!navigator.geolocation){if(showAlert)weatherStatus('Location is unavailable. Enter a city instead.');return;}
    weatherGeoBusy=true;
    if(showAlert)weatherStatus('Requesting location permission…');
    navigator.geolocation.getCurrentPosition(async pos=>{
      weatherGeoBusy=false;Object.assign(w,{mode:'auto',lat:pos.coords.latitude,lon:pos.coords.longitude,locAt:Date.now(),lastSync:0});
      w.city='Current location';save();await weatherFetch(true);
    },err=>{
      weatherGeoBusy=false;
      if(err.code===1)w.geoDenied=true;
      if(!w.lastSync){w.condition='Choose a city in Settings';updateWeatherDOM();}
      if(showAlert)weatherStatus('Location was not allowed. Enter a city instead.');
      if(w.mode==='city'&&w.lat!=null)weatherFetch();
    },{enableHighAccuracy:false,timeout:12000,maximumAge:20*60*1000});
  }
  function weatherAutoStart(){const w=ui.weather;
    if(w.mode==='auto'&&!w.geoDenied&&(!w.locAt||Date.now()-w.locAt>60*60*1000)) weatherLocation(false);
    else if(w.lat!=null&&w.lon!=null)weatherFetch();
    else if(w.city&&w.mode==='city')weatherCity(w.city);
    updateWeatherDOM();
  }
  function doUiAction(t){const a=t.dataset.uiAction,k=t.dataset.key;
    if(a==='edit-home'){homeEditing=!homeEditing;render()}
    else if(a==='move')widgetMove(k,t.dataset.dir);
    else if(a==='hide-widget'){if(!ui.hiddenWidgets.includes(k))ui.hiddenWidgets.push(k);save();render()}
    else if(a==='task-filter'){taskView=k;render()}
    else if(a==='quick-task')quickTask(t.dataset.category);
    else if(a==='close-quick'){document.querySelector('#ui-quick-task')?.remove()}
    else if(a==='save-quick'){const txt=document.querySelector('#ui-task-text')?.value.trim();if(!txt)return toast('Enter a task title.');S.tk.push({id:uid(),t:txt,p:document.querySelector('#ui-task-cat').value,d:document.querySelector('#ui-task-date').value,x:0});save();document.querySelector('#ui-quick-task')?.remove();render();}
    else if(a==='close-label')document.querySelector('#ui-label-sheet')?.remove();
    else if(a==='save-label'){ui.labels[k]=document.querySelector('#ui-label-edit').value.trim().slice(0,50)||WN[k];ui.labelColors[k]=document.querySelector('#ui-label-color')?.value||ui.accent;ui.hiddenLabels=ui.hiddenLabels.filter(x=>x!==k);save();document.querySelector('#ui-label-sheet')?.remove();render()}
    else if(a==='hide-label'){if(!ui.hiddenLabels.includes(k))ui.hiddenLabels.push(k);save();document.querySelector('#ui-label-sheet')?.remove();render()}
    else if(a==='theme'){S.theme=k;theme();save();render()}
    else if(a==='clear-icon'){ui.iconPhoto='';save();render()}
    else if(a==='clear-wallpaper'){ui.wallpaper='';save();render()}
    else if(a==='reset-home'){ui.widgetColumns=JSON.parse(JSON.stringify(DEFAULT_WIDGETS));ui.hiddenWidgets=['miniCal'];ui.hiddenLabels=[];ui.labels={};ui.labelColors={};save();render()}
    else if(a==='weather-location'){ui.weather.geoDenied=false;weatherLocation(true)}
    else if(a==='weather-city'){weatherCity(document.getElementById('ui-weather-city')?.value)}
    else if(a==='weather-refresh'){if(ui.weather.mode==='auto')weatherLocation(true);else weatherFetch(true)}
  }
  document.addEventListener('click',e=>{const t=e.target.closest('[data-ui-action]');if(t){e.preventDefault();e.stopPropagation();doUiAction(t);return}
    if(e.target.id==='ui-label-sheet'||e.target.id==='ui-quick-task')e.target.remove();},true);
  document.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.uiVisible){ui.hiddenWidgets=ui.hiddenWidgets.filter(x=>x!==t.dataset.uiVisible);if(!t.checked)ui.hiddenWidgets.push(t.dataset.uiVisible);save();render();}
    else if(t.dataset.uiHideLabel){ui.hiddenLabels=ui.hiddenLabels.filter(x=>x!==t.dataset.uiHideLabel);if(t.checked)ui.hiddenLabels.push(t.dataset.uiHideLabel);save();render();}
    else if(t.dataset.uiLabelColor){ui.labelColors[t.dataset.uiLabelColor]=t.value;save();render()}
    else if(t.id==='ui-font'){ui.font=t.value;save();render()}
    else if(t.id==='ui-accent'){ui.accent=t.value;ui.accentCustom=true;save();render()}
    else if(t.id==='ui-fontsize'){ui.fontSize=Number(t.value);save();render()}
    else if(t.id==='ui-icon-file'&&t.files?.[0])compress(t.files[0],220,.85,s=>{ui.iconPhoto=s;save();render()})
    else if(t.id==='ui-wallpaper-file'&&t.files?.[0])compress(t.files[0],1500,.73,s=>{ui.wallpaper=s;save();render()})
  },true);
  document.addEventListener('input',e=>{const t=e.target;
    if(t.dataset.uiLabelInput){ui.labels[t.dataset.uiLabelInput]=t.value.slice(0,50);save();}
    else if(t.id==='ui-fontsize'){const out=document.getElementById('ui-size-value');if(out)out.textContent=t.value+'%';document.documentElement.style.setProperty('--user-scale',String(Number(t.value)/100));}
  },true);
  function compress(file,max,quality,cb){if(!file.type.startsWith('image/'))return toast('Choose an image.');const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const ratio=Math.min(1,max/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',quality))};im.onerror=()=>toast('Could not read photo');im.src=reader.result};reader.onerror=()=>toast('Could not read photo');reader.readAsDataURL(file)}
  function holdTargetFrom(e){const t=e.target.closest('[data-ui-label]');return t?.dataset.uiLabel||null}
  document.addEventListener('pointerdown',e=>{const key=holdTargetFrom(e);if(!key||e.button!==0)return;longPressTriggered=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressTriggered=true;showLabelSheet(key);},650);},true);
  ['pointerup','pointercancel','pointermove','scroll'].forEach(kind=>document.addEventListener(kind,()=>clearTimeout(longPressTimer),true));
  document.addEventListener('contextmenu',e=>{const key=holdTargetFrom(e);if(key){e.preventDefault();clearTimeout(longPressTimer);if(!longPressTriggered)showLabelSheet(key)}},true);
  // Do not let a long press on a label cause a navigation click.
  document.addEventListener('click',e=>{if(longPressTriggered&&e.target.closest('[data-ui-label]')){e.preventDefault();e.stopImmediatePropagation();longPressTriggered=false}},true);
  theme();setVars();save();render();
  // A saved city or authorized location updates on every app opening and every 30 minutes.
  setTimeout(weatherAutoStart,350);
  setInterval(weatherAutoStart,30*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)weatherAutoStart();});
})();

</script>
<script id="planner-pencil-feature">
(function(){
"use strict";
if(window.PlannerInkReady)return;

var DB_NAME="personal-planner-pencil-v1", storeName="pages";
var db=null, pages=[], page=null, tool="pen", inkColor="#2d2d32", penWidth=3.2;

if(!S.ui)S.ui={};

function todayDate(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function genId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function noteClone(x){return JSON.parse(JSON.stringify(x))}
function openDatabase(){return new Promise(function(resolve,reject){
 if(!window.indexedDB){reject(new Error("Handwriting storage is not available"));return}
 var req=indexedDB.open(DB_NAME,2);
 req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains(storeName))req.result.createObjectStore(storeName,{keyPath:"id"});if(!req.result.objectStoreNames.contains("folders"))req.result.createObjectStore("folders",{keyPath:"id"})};
 req.onsuccess=function(){db=req.result;resolve(db)};
 req.onerror=function(){reject(req.error||new Error("Cannot open note storage"))};
 })}
function getPages(){return new Promise(function(resolve,reject){
 var req=db.transaction(storeName,"readonly").objectStore(storeName).getAll();
 req.onsuccess=function(){resolve(req.result||[])};
 req.onerror=function(){reject(req.error)};
 })}
function putPage(x){return new Promise(function(resolve,reject){
 var tx=db.transaction(storeName,"readwrite");
 tx.objectStore(storeName).put(noteClone(x));
 tx.oncomplete=function(){resolve()};
 tx.onerror=function(){reject(tx.error)};
 })}
function delPage(id){return new Promise(function(resolve,reject){
 var tx=db.transaction(storeName,"readwrite");
 tx.objectStore(storeName).delete(id);
 tx.oncomplete=function(){resolve()};
 tx.onerror=function(){reject(tx.error)};
 })}
function refreshPages(){return getPages().then(function(all){pages=all.sort(function(a,b){return (b.updated||0)-(a.updated||0)})})}
function applyKit(){
 var root=document.documentElement,keys=["--bg","--card","--tx","--mut","--line","--kit-side"],source=["bg","card","text","muted","line","sidebar"];
 if(S.theme==="color-kit"){
  for(var i=0;i<keys.length;i++)root.style.setProperty(keys[i],S.ui.colorKit[source[i]]);
  root.style.setProperty("--app-accent",S.ui.colorKit.accent);
 }else{
  keys.forEach(function(k){root.style.removeProperty(k)});
  if(S.theme==="modern-ios")root.style.setProperty("--app-accent","#0877d7");
  else if(S.ui.accent)root.style.setProperty("--app-accent",S.ui.accent);
 }
}
var originalRender=render;
render=function(){originalRender();applyKit();decorate()};
function decorationsForNotes(){
 if(V!=="notes"||document.getElementById("ink-notebook"))return;
 var host=document.querySelector("#m .card");if(!host)return;
 var box=document.createElement("section");box.id="ink-notebook";box.className="card ink-notebook";
 var tiles=pages.map(function(n){return '<div class="ink-note-tile"><span class="ink-scribble" aria-hidden="true">✎</span><strong>'+h(n.title||"Untitled page")+'</strong><small>'+h(n.date||"")+' · '+(n.strokes||[]).length+' strokes</small><div class="ink-actions"><button class="btn" data-ink="open" data-id="'+h(n.id)+'">Open</button><button class="btn" data-ink="delete" data-id="'+h(n.id)+'" aria-label="Delete note">Delete</button></div></div>'}).join("");
 box.innerHTML='<div class="ui-panel-head"><div><h2 style="margin:0 0 6px">Handwritten pages</h2><div class="sub">Write with Apple Pencil. Attach a date and keep your pages.</div></div><button class="btn pri" data-ink="new">+ New page</button></div><div class="ink-actions"><button class="btn" data-ink="export">Export ink backup</button><label class="btn">Import ink backup<input type="file" id="ink-import" accept=".json,application/json" hidden></label></div><div class="ink-note-grid">'+(tiles||'<p class="sub">No handwritten pages yet. Start one with New page.</p>')+'</div>';
 host.before(box);
}
function decorationsForCalendar(){
 if(V!=="cal"||document.getElementById("ink-calendar-links"))return;
 var host=document.querySelector("#m .ui-cal-header .card")||document.querySelector("#m .card");if(!host)return;
 var box=document.createElement("div");box.id="ink-calendar-links";box.className="ink-cal-link";
 var date=typeof C!=="undefined"&&M==="day"?ymd(C):todayDate();
 var relevant=pages.filter(function(n){return n.date&&n.date.slice(0,7)===ymd(C).slice(0,7)});
 box.innerHTML='<button class="btn" data-ink="new-calendar" data-date="'+h(date)+'">✎ New dated note</button><button class="btn" data-ink="goto-notes">Handwritten Notes ('+pages.length+')</button>'+relevant.slice(0,4).map(function(n){return '<button class="ink-calendar-note" data-ink="open" data-id="'+h(n.id)+'">'+h(n.date.slice(5))+' · '+h(n.title||"Ink note")+'</button>'}).join("");
 host.insertBefore(box,host.firstChild);
}
function decorationsForSettings(){
 if(V!=="set"||document.getElementById("ink-color-kit"))return;
 var gallery=document.querySelector(".ui-theme-select");
 if(gallery){
  [["modern-ios","Modern iPad"],["color-kit","My Color Kit"]].forEach(function(pair){
   if(gallery.querySelector('[data-key="'+pair[0]+'"]'))return;
   var b=document.createElement("button");b.type="button";b.className=S.theme===pair[0]?"selected":"";b.dataset.uiAction="theme";b.dataset.key=pair[0];
   b.setAttribute("aria-pressed",S.theme===pair[0]?"true":"false");
   b.innerHTML='<span class="ui-theme-swatch" style="background:'+(pair[0]==="modern-ios"?"linear-gradient(110deg,#f9f9fd,#d9e8fb)":"linear-gradient(110deg,#f1e8dc,#c6b6d9)")+'"></span><span>'+pair[1]+'</span>';
   gallery.appendChild(b);
  });
 }
 var first=document.querySelector("#ui-settings .ui-settings-card");if(!first)return;
 var box=document.createElement("div");box.id="ink-color-kit";box.className="ink-kit";
 var fields=[["bg","Background"],["card","Panels"],["sidebar","Sidebar"],["text","Text"],["muted","Secondary text"],["line","Borders"],["accent","Accent"]];
 box.innerHTML='<h2>My Color Kit</h2><p>Build your own palette. Each swatch is editable; switching to the kit applies your colors immediately.</p><div class="ink-kit-grid">'+fields.map(function(x){return '<label>'+x[1]+'<input type="color" data-ink-color="'+x[0]+'" value="'+h(S.ui.colorKit[x[0]])+'"></label>'}).join("")+'</div><div class="ink-kit-row"><button class="btn pri" data-ink="apply-kit">Use My Colors</button><button class="btn" data-ink="kit-reset">Reset palette</button></div>';
 first.appendChild(box);
}
function decorate(){decorationsForNotes();decorationsForCalendar();decorationsForSettings()}
function inkStatus(x){var e=document.getElementById("ink-status");if(e)e.textContent=x}
function undoSnapshot(){past.push(JSON.stringify(page.strokes));if(past.length>35)past.shift();future=[]}
function paperDraw(ctx,kind){
 ctx.fillStyle="#fffefb";ctx.fillRect(0,0,1000,1400);
 ctx.strokeStyle=kind==="grid"?"#e3e7ec":"#e1e4eb";ctx.lineWidth=1;
 if(kind==="lined"||kind==="grid"){
  for(var y=52;y<1400;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}
 }
 if(kind==="grid"){for(var x=0;x<1000;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1400);ctx.stroke()}}
 if(kind==="dotted"){
  ctx.fillStyle="#dce0e6";for(var dy=32;dy<1400;dy+=36)for(var dx=32;dx<1000;dx+=36){ctx.beginPath();ctx.arc(dx,dy,1.3,0,Math.PI*2);ctx.fill()}
 }
}
function strokeDraw(ctx,s){
 if(!s.points||!s.points.length)return;
 ctx.save();ctx.lineJoin="round";ctx.lineCap="round";ctx.strokeStyle=s.color||"#24242a";
 ctx.fillStyle=s.color||"#24242a";ctx.globalAlpha=s.tool==="highlighter"?.28:1;
 var pts=s.points, width=Math.max(1,Number(s.width)||3);
 if(pts.length===1){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],width/2,0,Math.PI*2);ctx.fill();ctx.restore();return}
 for(var i=1;i<pts.length;i++){
  var a=pts[i-1],b=pts[i],pressure=typeof b[2]==="number"?b[2]:.5;
  ctx.lineWidth=width*(s.tool==="highlighter"?1:Math.max(.55,Math.min(1.35,.65+pressure*.85)));
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
 }
 ctx.restore();
}
function draw(){
 var c=document.getElementById("ink-canvas");if(!c||!page)return;
 var ctx=c.getContext("2d");if(!ctx)return;
 paperDraw(ctx,page.paper||"lined");
 (page.strokes||[]).forEach(function(s){strokeDraw(ctx,s)});
 if(activeStroke)strokeDraw(ctx,activeStroke);
}
function point(e){
 var r=document.getElementById("ink-canvas").getBoundingClientRect();
 return [Math.max(0,Math.min(1000,(e.clientX-r.left)*1000/r.width)),
 Math.max(0,Math.min(1400,(e.clientY-r.top)*1400/r.height)),
 e.pointerType==="pen"&&e.pressure>0?e.pressure:.5];
}
function toSegment(p,a,b){var dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function eraseNear(p){
 var index=-1,best=16;
 page.strokes.forEach(function(s,i){
  var pts=s.points||[];
  for(var j=1;j<pts.length;j++){var dist=toSegment(p,pts[j-1],pts[j]);if(dist<best){best=dist;index=i}}
  if(pts.length===1&&Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1])<best){best=10;index=i}
 });
 if(index>=0){page.strokes.splice(index,1);draw()}
}
function onPointerDown(e){
 if(activePointer!==null||!page||e.button>0)return;
 if(penOnly&&e.pointerType!=="pen")return;
 e.preventDefault();var c=e.currentTarget;try{c.setPointerCapture(e.pointerId)}catch(_){}
 activePointer=e.pointerId;undoSnapshot();
 if(tool==="eraser"){activeStroke=null;eraseNear(point(e))}
 else{activeStroke={tool:tool,color:inkColor,width:tool==="highlighter"?penWidth*6:penWidth,points:[point(e)]};draw()}
}
function onPointerMove(e){
 if(activePointer!==e.pointerId)return;
 e.preventDefault();var evs=typeof e.getCoalescedEvents==="function"?e.getCoalescedEvents():[];
 if(!evs.length)evs=[e];
 for(var i=0;i<evs.length;i++){if(tool==="eraser")eraseNear(point(evs[i]));else if(activeStroke)activeStroke.points.push(point(evs[i]))}

}
function onPointerUp(e){

}

 page.title=(document.getElementById("ink-title")||{}).value||page.title||"Untitled page";

}

}
function openEditor(doc){
 page=noteClone(doc);page.strokes=page.strokes||[];page.paper=page.paper||"lined";
 past=[];future=[];tool="pen";activePointer=null;activeStroke=null;
 document.getElementById("ink-overlay")?.remove();

}
function newNote(d,eventId,eventName){

function download(text,type,name){

}

}
async function exportNotes(){
 try{await refreshPages();download(JSON.stringify({kind:"Personal Planner Ink Backup",version:1,date:new Date().toISOString(),pages:pages},null,2),"application/json","planner-handwriting-backup.json");toast("Ink backup exported")}
 catch(err){toast("Could not export handwritten notes")}
}
async function importNotes(file){
 if(!file||file.size>15*1024*1024){toast("Choose an ink backup under 15 MB");return}
 try{var j=JSON.parse(await file.text());if(!j||j.kind!=="Personal Planner Ink Backup"||!Array.isArray(j.pages))throw new Error("Not an ink backup");
  var count=0;for(var i=0;i<j.pages.length;i++){
   var n=j.pages[i];if(!n||!Array.isArray(n.strokes)||n.strokes.length>20000)continue;
   var clean={id:genId(),title:String(n.title||"Imported page").slice(0,90),date:/^\d{4}-\d{2}-\d{2}$/.test(n.date||"")?n.date:todayDate(),eventId:"",paper:["plain","lined","grid","dotted"].includes(n.paper)?n.paper:"lined",strokes:n.strokes,created:Date.now(),updated:Date.now()};
   await putPage(clean);count++;
  }
  await refreshPages();render();toast("Imported "+count+" handwritten pages");
 }catch(err){toast("Could not read ink backup")}
}
async function doAction(t){
 var action=t.dataset.ink,id=t.dataset.id;
 if(action==="new"){newNote(todayDate());return}
 if(action==="new-calendar"){newNote(t.dataset.date||todayDate());return}
 if(action==="new-event"){
  var eventDate=document.getElementById("f-d")?.value||todayDate();
  var eventTitle=document.getElementById("f-t")?.value||"Event";
  var idInput=document.querySelector("#ov [data-a=saveev]");
  newNote(eventDate,idInput?.dataset.id||"",eventTitle);return
 }
 if(action==="open"){var n=pages.find(function(p){return p.id===id});if(n)openEditor(n);return}
 if(action==="delete"){if(!confirm("Delete this handwritten page?"))return;try{await delPage(id);await refreshPages();render()}catch(e){toast("Could not delete page")}return}
 if(action==="close"){await closeEditor();return}
 if(action==="goto-notes"){V="notes";render();return}
 if(action==="calendar-day"){var noteDate=page&&page.date?page.date:todayDate();await closeEditor();V="cal";M="day";C=pd(noteDate);render();return}
 if(action==="tool"){tool=t.dataset.tool;document.querySelectorAll("#ink-overlay [data-ink=tool]").forEach(function(b){b.classList.toggle("on",b.dataset.tool===tool)});return}
 if(action==="swatch"){inkColor=t.dataset.color;document.querySelectorAll("#ink-overlay .ink-swatch").forEach(function(b){b.classList.toggle("selected",b.dataset.color===inkColor)});document.getElementById("ink-custom-color").value=inkColor;return}
 if(action==="undo"&&past.length){future.push(JSON.stringify(page.strokes));page.strokes=JSON.parse(past.pop());draw();queueSave();return}
 if(action==="redo"&&future.length){past.push(JSON.stringify(page.strokes));page.strokes=JSON.parse(future.pop());draw();queueSave();return}
 if(action==="png"){savePNG();return}
 if(action==="export"){await exportNotes();return}
 if(action==="apply-kit"){S.theme="color-kit";theme();save();render();return}
 if(action==="kit-reset"){S.ui.colorKit=Object.assign({},defaultKit);S.theme="color-kit";theme();save();render();return}
}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-ink]");if(!t)return;
 e.preventDefault();e.stopPropagation();doAction(t).catch(function(err){console.warn("Ink action failed",err);toast("Could not complete action")});
},true);
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.id==="ink-title"||t.id==="ink-date"){if(page)queueSave()}
 else if(t.id==="ink-size"){penWidth=Number(t.value)}
 else if(t.id==="ink-custom-color"){inkColor=t.value;document.querySelectorAll("#ink-overlay .ink-swatch").forEach(function(b){b.classList.remove("selected")})}
},true);
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.id==="ink-pencil-only"){penOnly=t.checked}
 else if(t.id==="ink-paper"&&page){page.paper=t.value;draw();queueSave()}
 else if(t.id==="ink-import"&&t.files[0])importNotes(t.files[0]);
 else if(t.dataset.inkColor){
  S.ui.colorKit[t.dataset.inkColor]=t.value;S.theme="color-kit";theme();save();render()
 }
},true);

 var b=document.createElement("button");b.type="button";b.className="btn";b.textContent="✎ Handwritten note";b.dataset.ink="new-event";b.style.margin="8px";ov.querySelector("#f-d").closest("label,div")?.appendChild(b);

/* ink-folders-v2: current handwriting pages remain in the original IndexedDB store */
var inkFolders=[],inkActiveFolder="folder-default";
var inkDefaultFolder="folder-default",inkUnfiledFolder="folder-unfiled";
var inkTabColors=["#efaaa2","#e98097","#cf79b3","#aa84c5","#888bc8","#6a98cb","#48b5cb","#51bfc0","#8dbeb9"];
function inkFolderID(n){return n&&n.folderId||inkUnfiledFolder}
function inkPagesIn(id){return pages.filter(function(n){return inkFolderID(n)===id}).sort(function(a,b){return (b.updated||0)-(a.updated||0)})}
function inkFolderName(id){if(id===inkUnfiledFolder)return "Unfiled";return inkFolders.find(function(f){return f.id===id})?.title||"My Notebook"}
function inkFolderTint(id){if(id===inkUnfiledFolder)return "#d8d5de";return inkFolders.find(function(f){return f.id===id})?.color||inkTabColors[0]}
function inkGetFolders(){return new Promise(function(resolve,reject){var r=db.transaction("folders","readonly").objectStore("folders").getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
function inkPutFolder(f){return new Promise(function(resolve,reject){var t=db.transaction("folders","readwrite");t.objectStore("folders").put(f);t.oncomplete=function(){resolve()};t.onerror=function(){reject(t.error)}})}
async function inkLoadFolders(){
 inkFolders=await inkGetFolders();
 if(!inkFolders.some(function(f){return f.id===inkDefaultFolder})){
  await inkPutFolder({id:inkDefaultFolder,title:"My Notebook",color:inkTabColors[0],created:Date.now()});inkFolders=await inkGetFolders();
 }
 inkFolders.sort(function(a,b){return (a.created||0)-(b.created||0)});
}
function inkDisplayTitle(n){return !n||n==="Untitled page"?"New note":n}
decorationsForNotes=function(){
 if(V!=="notes"||document.getElementById("ink-notebook"))return;
 var original=document.querySelector("#m .card");if(!original)return;

 var all=inkFolders.concat(unfiledCount?[{id:inkUnfiledFolder,title:"Unfiled",color:"#d8d5de"}]:[]);
 var folderHTML=all.map(function(f){var count=inkPagesIn(f.id).length;
  return '<div class="ink-folder-tile" style="--folder-tint:'+h(f.color)+'"><button type="button" data-ink="open-folder" data-id="'+h(f.id)+'"><span class="ink-folder-mark">▤</span><strong>'+h(f.title)+'</strong><small>'+count+' '+(count===1?'page':'pages')+'</small></button>'+(f.id===inkUnfiledFolder?'':'<button type="button" class="btn" data-ink="rename-folder" data-id="'+h(f.id)+'">Rename</button>')+'</div>'

  return '<button type="button" class="ink-note-row" data-ink="open" data-id="'+h(n.id)+'"><span class="ink-note-paper"></span><span style="flex:1"><strong>'+h(inkDisplayTitle(n.title))+'</strong><small>'+h(inkFolderName(inkFolderID(n)))+' · '+h(n.date||"")+'</small></span><span aria-hidden="true">›</span></button>'
 }).join("");
 library.innerHTML='<div class="ink-hub-head"><div><h1>Notes</h1><p>Choose a folder to open your notebook.</p></div><div class="ink-actions"><button class="btn" data-ink="create-folder">＋ New Folder</button><button class="btn" data-ink="export">Export notebooks</button><label class="btn">Import backup<input id="ink-import" type="file" accept=".json,application/json" hidden></label></div></div><div class="ink-hub-caption">Folders</div><div class="ink-folder-grid">'+folderHTML+'</div><div class="ink-hub-caption">Recent notes</div><div class="ink-note-list">'+(recentHTML||'<p class="sub">Your handwritten pages will appear here.</p>')+'</div><button type="button" class="ink-hub-fab" data-ink="new-sheet" aria-label="New note" title="New note">＋</button>';
 original.before(library);
 var details=document.createElement("details");details.className="ink-typed-notes";details.innerHTML="<summary>Typed notes</summary>";original.before(details);details.appendChild(original);
};
var inkOldPaperDraw=paperDraw;
paperDraw=function(ctx,kind){
 if(kind!=="notebook")return inkOldPaperDraw(ctx,kind);
 ctx.fillStyle="#fff";ctx.fillRect(0,0,1000,1400);
 ctx.fillStyle="#fff0f0";ctx.fillRect(33,57,585,52);ctx.fillRect(637,57,329,52);
 ctx.fillStyle="#535059";ctx.font="bold 16px -apple-system,Arial";ctx.fillText("TITLE",50,90);ctx.fillText("DATE",654,90);
 ctx.font="25px -apple-system,Arial";ctx.fillStyle="#303037";
 if(page&&page.title&&page.title!=="Untitled page")ctx.fillText(page.title,50,161,550);
 if(page&&page.date)ctx.fillText(page.date,655,161,290);
 ctx.font="20px -apple-system,Arial";var wd=["M","T","W","T","F","S","S"];wd.forEach(function(v,i){ctx.fillText(v,649+i*44,208)});
 ctx.strokeStyle="#99969a";ctx.lineWidth=1.2;ctx.setLineDash([1.5,5.2]);
 for(var y=265;y<1385;y+=56){ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(952,y);ctx.stroke()}
 ctx.setLineDash([]);
};
var inkOldEditorHTML=editorHTML;
editorHTML=function(){
 var html=inkOldEditorHTML();
 var fid=inkFolderID(page),sheetList=inkPagesIn(fid);
 if(!sheetList.some(function(p){return p.id===page.id}))sheetList.unshift(page);
 html=html.replace('<button data-ink="close">‹ Back</button>','<button data-ink="close">‹ Notes</button><span class="ink-sheet-folder">▤ '+h(inkFolderName(fid))+'</span>');
 html=html.replace('<option value="lined">Lined</option>','<option value="notebook">Notebook template</option><option value="lined">Lined</option>');
 var opts=sheetList.slice(0,150).map(function(n){return '<option value="'+h(n.id)+'"'+(n.id===page.id?' selected':'')+'>'+h(inkDisplayTitle(n.title).slice(0,32))+'</option>'}).join("");
 html=html.replace('<div class="ink-toolbar"><button data-ink="undo">','<div class="ink-toolbar"><label style="font-size:13px">Pages <select class="ink-sheet-select" id="ink-switch-page" aria-label="Select notebook page">'+opts+'</select></label><button data-ink="undo">');
 var tabs=sheetList.slice(0,9).map(function(n,i){return '<button type="button" data-ink="switch-sheet" data-id="'+h(n.id)+'" class="ink-page-tab'+(n.id===page.id?' active':'')+'" style="--tab-color:'+inkTabColors[i%inkTabColors.length]+'" title="'+h(inkDisplayTitle(n.title))+'">'+String(i+1).padStart(2,"0")+'</button>'}).join("");
 html=html.replace('<canvas id="ink-canvas" width="1000" height="1400" aria-label="Handwriting canvas"></canvas></div>','<canvas id="ink-canvas" width="1000" height="1400" aria-label="Handwriting canvas"></canvas><div class="ink-page-tabs" aria-label="Notebook page tabs">'+tabs+'</div></div>');
 html=html.replace('<div class="ink-tools-bottom">','<button type="button" class="ink-sheet-fab" data-ink="new-sheet" title="New page" aria-label="New notebook page">＋</button><div class="ink-tools-bottom">');
 return html;
};
var inkOldOpenEditor=openEditor;
openEditor=function(documentPage){inkActiveFolder=inkFolderID(documentPage);inkOldOpenEditor(documentPage)};
newNote=function(d,eventId,eventName,folderId){
 var now=Date.now(),x={id:genId(),title:eventName?eventName+" notes":"Untitled page",date:d||todayDate(),eventId:eventId||"",folderId:folderId||(V==="notes"?inkActiveFolder:inkDefaultFolder),paper:"notebook",strokes:[],created:now,updated:now};
 openEditor(x);saveInk();
};
exportNotes=async function(){
 try{await refreshPages();await inkLoadFolders();download(JSON.stringify({kind:"Personal Planner Ink Backup",version:2,date:new Date().toISOString(),pages:pages,folders:inkFolders},null,2),"application/json","planner-notebooks-backup.json");toast("Notebook backup exported")}
 catch(e){console.warn(e);toast("Could not export notes")}
};
importNotes=async function(file){
 if(!file||file.size>25*1024*1024)return toast("Select a notebook backup smaller than 25 MB");
 try{
 var data=JSON.parse(await file.text());if(data.kind!=="Personal Planner Ink Backup"||!Array.isArray(data.pages))throw Error("Invalid ink backup");
 var mapping={},count=0;
 for(var i=0;i<(data.folders||[]).length;i++){var f=data.folders[i];if(!f||!f.id||!f.title)continue;
  var fid="folder-"+genId();mapping[f.id]=fid;
  await inkPutFolder({id:fid,title:String(f.title).slice(0,50),color:/^#[0-9a-f]{6}$/i.test(f.color||"")?f.color:inkTabColors[i%inkTabColors.length],created:Date.now()+i});
 }
 for(var j=0;j<data.pages.length;j++){var n=data.pages[j];if(!n||!Array.isArray(n.strokes)||n.strokes.length>20000)continue;
  await putPage({id:genId(),title:String(n.title||"Imported page").slice(0,90),date:/^\d{4}-\d{2}-\d{2}$/.test(n.date||"")?n.date:todayDate(),eventId:"",folderId:mapping[n.folderId]||inkUnfiledFolder,paper:["notebook","lined","plain","grid","dotted"].includes(n.paper)?n.paper:"lined",strokes:n.strokes,created:Date.now(),updated:Date.now()});count++;
 }
 await refreshPages();await inkLoadFolders();render();toast("Imported "+count+" notes");
 }catch(e){console.warn(e);toast("Could not import notebook backup")}
};
var inkOldDoAction=doAction;
doAction=async function(el){
 var action=el.dataset.ink,id=el.dataset.id;
 if(action==="create-folder"){if(!db)return toast("Storage unavailable");var title=prompt("Name your new folder:","New Folder");if(title===null)return;
  title=title.trim().slice(0,50);if(!title)return toast("Please name your folder");
  var record={id:"folder-"+genId(),title:title,color:inkTabColors[inkFolders.length%inkTabColors.length],created:Date.now()};
  await inkPutFolder(record);await inkLoadFolders();inkActiveFolder=record.id;newNote(todayDate(),"","",record.id);return;
 }
 if(action==="rename-folder"){
  var f=inkFolders.find(function(x){return x.id===id});if(!f)return;
  var next=prompt("Rename folder:",f.title);if(next===null)return;next=next.trim().slice(0,50);if(!next)return;
  f.title=next;await inkPutFolder(f);await inkLoadFolders();render();return;
 }
 if(action==="open-folder"){inkActiveFolder=id;var p=inkPagesIn(id)[0];if(p)openEditor(p);else newNote(todayDate(),"","",id);return}
 if(action==="new-sheet"){var folder=page?inkFolderID(page):inkActiveFolder;if(page)await saveInk();newNote(todayDate(),"","",folder);return}
 if(action==="switch-sheet"){var p=pages.find(function(n){return n.id===id});if(!p||p.id===page?.id)return;if(page)await saveInk();openEditor(p);return}
 if(action==="open"){var open=pages.find(function(n){return n.id===id});if(open)inkActiveFolder=inkFolderID(open)}
 return inkOldDoAction(el);
};
document.addEventListener("change",function(e){if(e.target.id!=="ink-switch-page")return;var p=pages.find(function(n){return n.id===e.target.value});if(!p)return;
 (async function(){if(page)await saveInk();openEditor(p)})().catch(function(err){console.warn(err);toast("Could not open this page")});
},true);
document.addEventListener("input",function(e){if(page?.paper==="notebook"&&(e.target.id==="ink-title"||e.target.id==="ink-date"))draw()},true);

openDatabase().then(function(){return refreshPages()}).then(function(){return inkLoadFolders()}).then(function(){render()}).catch(function(err){
 console.warn("Handwriting storage unavailable",err);
 render();toast("Drawing storage unavailable on this device; check browser storage settings");
});
})();
